description: Phoenix Wireless (Phoenix Wireless Group) was a manufacturer of wireless
  telecommunications accessories and hardware, founded in 1994 and headquartered in
  West Chester, PA. Its product lines included antennas, Bluetooth headsets, phone
  clips, mounts and fasteners, induction chargers, travel chargers, and batteries.
  The company was acquired by Communications Test Design, Inc. (CTDI) on September 26,
  2008 and no longer operates as an independent entity. It was surfaced as a portfolio
  company of Battery Ventures and added to the API Evangelist network as a stub for
  enrichment; the enrichment pass found no public API, developer portal, documentation,
  SDK, or other machine-readable developer surface to catalog.
